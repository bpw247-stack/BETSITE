<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BetsFriend">
  <meta name="theme-color" content="#131c2e">
  <title>BetsFriend</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
  <link rel="preload" href="fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/barlow-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/dashboard" aria-label="BetsFriend home"><svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="5.5"/><circle cx="12" cy="12" r="1.6" class="bull"/></svg><span>BetsFriend</span></a>
    <nav class="nav" id="nav">
      <a href="#/dashboard" data-view="dashboard">Dashboard</a>
      <a href="#/bets" data-view="bets">Bets</a>
      <a href="#/props" data-view="props">Props</a>
      <a href="#/insights" data-view="insights">Insights</a>
      <a href="#/teams" data-view="teams">Teams</a>
      <a href="#/matchups" data-view="matchups">Matchups</a>
      <a href="#/rankings" data-view="rankings">Rankings</a>
      <a href="#/market" data-view="market">Market</a>
      <a href="#/injuries" data-view="injuries">Injuries</a>
      <a href="#/notes" data-view="notes">Notes</a>
      <a href="#/settings" data-view="settings">Settings</a>
    </nav>
    <button class="btn primary" id="addBetBtn">+ Add bet</button>
  </header>

  <div id="updateBanner" class="update-banner" role="status" hidden></div>
  <div id="settleBanner" class="update-banner settle-banner" role="status" hidden></div>
  <main id="app" class="container" aria-live="polite"></main>
  <div id="overlay" class="overlay" hidden><div class="overlay-box"></div></div>

  <dialog id="modal">
    <form method="dialog" id="modalForm"></form>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="tooltip" class="tooltip" hidden></div>

  <script src="teams.js"></script>
  <script src="stats.js"></script>
  <script src="slip.js"></script>
  <script src="splits.js"></script>
  <script src="app.js"></script>
</body>
</html>
